name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ts || npm install --prefix ts
      - run: npm --prefix ts run typecheck
      - run: npm --prefix ts test
      # Presence, which a coverage percentage structurally cannot check: a module no test imports
      # is *absent* from the report rather than shown at 0%, so the percentage above it is computed
      # without it and reads as clean. Three modules sat fully untested behind a 98% that way.
      - name: every source module appears in the coverage report
        working-directory: ts
        run: |
          node --test --experimental-strip-types --experimental-test-coverage 'test/**/*.test.ts' 2>&1 \
            | node scripts/check-coverage-completeness.mjs src
      # T-18. A different question from the step above, and neither replaces the other: this asks
      # whether the number slipped, that one asks whether a module is in the report at all. A floor
      # over a number that omits a file is a floor over the wrong number.
      #
      # `npm --prefix ts test` runs separately above, so a failing test cannot hide behind this
      # pipeline's exit code.
      - name: coverage floors
        working-directory: ts
        run: |
          node --test --experimental-strip-types --experimental-test-coverage 'test/**/*.test.ts' 2>&1 \
            | node scripts/check-coverage-floor.mjs

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e 'py[dev]'
      # T-18: a floor just below current, so a regression trips it. **Raise it as coverage
      # improves; never lower it to make a build pass** — a change that justifies a lower floor
      # should argue for it in the commit message, where a reviewer sees it.
      #
      # Note the two gates are different questions. This one asks whether the *number* slipped;
      # `check-coverage-completeness` below asks whether a module is in the report at all, which a
      # percentage structurally cannot — a module no test imports is absent rather than red, and
      # three of them sat untested behind a 98% that way.
      - run: python -m pytest py --cov=verity_app --cov-fail-under=91
      - run: python -m ruff check py
      - run: python -m mypy py/verity_app

  # The two implementations must not drift, and until this job existed nothing enforced it: only the
  # Python suite read `test-vectors/parity.json`, which made TypeScript the oracle. A review proved
  # the gap by breaking the HKDF binding in `ts/src/seal.ts` — both suites stayed green while the two
  # languages produced mutually unopenable export bundles.
  #
  # Both suites now assert against the committed vectors, and this job additionally regenerates them
  # and requires no diff, so a deliberate wire-contract change has to be committed as one.
  parity:
    name: parity vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ts || npm install --prefix ts
      - name: regenerate and compare
        run: |
          node --experimental-strip-types ts/scripts/emit-vectors.ts > /tmp/parity.json
          python3 scripts/compare-vectors.py test-vectors/parity.json /tmp/parity.json
